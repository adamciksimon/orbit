name: Release app

# Push a version tag to release: git tag v0.2 && git push origin v0.2
#
# With the Developer ID secrets set, the app is signed and notarized so it opens
# without warnings. Without them it is signed ad hoc and users have to approve
# it in System Settings › Privacy & Security.
#   DEVELOPER_ID_P12           base64 of the exported Developer ID Application .p12
#   DEVELOPER_ID_P12_PASSWORD  the .p12's export password
#   NOTARY_APPLE_ID            Apple ID on the Outloud US LLC team used to notarize
#   NOTARY_PASSWORD            an app-specific password for that Apple ID
on:
  push:
    tags: ["v*"]

jobs:
  build:
    # The project needs Xcode 27; this image is in public preview on GitHub.
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_APPLE_ID != '' }}
      # Outloud US LLC, the team that owns the Developer ID certificate.
      NOTARY_TEAM_ID: GH26ZAF4Y5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Developer ID signing and notarization
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in DEVELOPER_ID_P12." >&2; exit 1; }
          echo "Signing as: $identity"

          xcrun notarytool store-credentials orbit-notary --keychain "$keychain" \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"

          {
            echo "DEVELOPER_ID=$identity"
            echo "NOTARY_PROFILE=orbit-notary"
            echo "NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build Orbit.dmg
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          xcodebuild -version
          if [[ -z "${DEVELOPER_ID:-}" ]]; then
            echo "::warning::No Developer ID secrets; building an ad hoc signed, unnotarized app."
            export AD_HOC=1
          fi
          APP_VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            orbit-app/scripts/package.sh

      - name: Remove signing keychain
        if: always() && env.NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$NOTARY_KEYCHAIN"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" orbit-app/dist/Orbit.dmg \
            --title "Orbit ${GITHUB_REF_NAME#v}" --generate-notes

  deploy-web:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit
